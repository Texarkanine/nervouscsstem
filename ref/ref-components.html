<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NERV Components — ref-components</title>
  <link rel="stylesheet" href="../dist/nerv.css">
  <style>
    /* Reference page layout — NOT part of the design system */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--nerv-void);
      color: var(--nerv-amber);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ref-viewport {
      position: relative;
      width: 1100px;
      max-width: 98vw;
      aspect-ratio: 16 / 10;
    }

    .ref-grid-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .ref-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 4fr 8fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: 100%;
      gap: 2px;
    }

    /* Zone A: top-left — MAGI panel */
    .ref-zone-a {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      gap: 0.5rem;
    }

    .ref-zone-a-header {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1rem;
      color: var(--nerv-amber);
      letter-spacing: 0.15em;
      text-align: center;
    }

    /* Zone B: top-right — Bar meters */
    .ref-zone-b {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem 2rem;
      gap: 1.2rem;
    }

    .ref-meter-row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .ref-meter-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(var(--nerv-amber-rgb), 0.6);
    }

    /* Zone C: bottom-left — Segment display + label boxes */
    .ref-zone-c {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      gap: 1.5rem;
    }

    .ref-segment-container {
      text-align: center;
    }

    .ref-segment-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.6rem;
      color: rgba(var(--nerv-amber-rgb), 0.5);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    /* Zone D: bottom-right — Status text cycling demo */
    .ref-zone-d {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 2rem;
      gap: 1rem;
    }

    .ref-status-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.6rem;
      color: rgba(var(--nerv-amber-rgb), 0.5);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* Dividers between zones */
    .ref-divider-h {
      grid-column: 1 / -1;
      grid-row: 1 / 2;
      align-self: end;
    }

    .ref-divider-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(100% / 3);
      z-index: 2;
    }
  </style>
</head>

  <script src="../dist/nerv.js"></script>
  <script>
    NERV.init();

    // Zone D status text cycling demo
    (function () {
      var phases = [
        { text: 'NOMINAL',             cls: 'nerv-status-nominal',  extra: '',                              label: 'Phase 1 / 4' },
        { text: 'APPROACHING LIMITS',  cls: 'nerv-status-caution',  extra: '',                              label: 'Phase 2 / 4' },
        { text: 'DANGER',              cls: 'nerv-status-danger',   extra: 'nerv-blink',                    label: 'Phase 3 / 4' },
        { text: 'EMERGENCY',           cls: 'nerv-status-critical', extra: 'nerv-glitch',                   label: 'Phase 4 / 4' }
      ];
      var idx = 0;
      var container = document.getElementById('status-demo');
      var timer = document.getElementById('status-timer');

      function cycle() {
        idx = (idx + 1) % phases.length;
        var p = phases[idx];
        var span = document.createElement('span');
        span.className = 'nerv-status-text ' + p.cls;
        if (p.extra) span.classList.add(p.extra);
        if (p.extra === 'nerv-glitch') span.setAttribute('data-text', p.text);
        span.textContent = p.text;
        container.innerHTML = '';
        container.appendChild(span);
        timer.textContent = p.label;
      }

      setInterval(cycle, 2500);
    })();
  </script>
