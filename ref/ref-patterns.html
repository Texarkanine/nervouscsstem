<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NERV Patterns — ref-patterns</title>
  <link rel="stylesheet" href="../dist/nerv.css">
  <style>
    /* Reference page layout — NOT part of the design system */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--nerv-void);
      color: var(--nerv-amber);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ref-viewport {
      position: relative;
      width: 960px;
      max-width: 96vw;
      aspect-ratio: 4 / 3;
    }

    .ref-grid-bg {
      position: absolute;
      top: 4.5rem;
      bottom: 4.5rem;
      left: 0;
      right: 0;
      z-index: 0;
    }

    .ref-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 2rem 1fr 260px;
      grid-template-rows: auto auto 1fr auto auto;
      width: 100%;
      height: 100%;
      gap: 2px;
    }

    /* === Stripe bars === */
    .ref-stripe-top-green {
      grid-column: 1 / -1;
      grid-row: 1;
    }

    .ref-stripe-left {
      grid-column: 1;
      grid-row: 3;
    }

    .ref-stripe-bottom-green {
      grid-column: 1 / -1;
      grid-row: 5;
    }

    /* === DANGER / EMERGENCY bars === */
    .ref-alert-bar {
      position: relative;
      height: 2.5rem;
    }

    .ref-alert-bar-top {
      grid-column: 1 / -1;
      grid-row: 2;
    }

    .ref-alert-bar-bottom {
      grid-column: 1 / -1;
      grid-row: 4;
    }

    .ref-alert-bar-stripe {
      position: absolute;
      inset: 0;
    }

    .ref-alert-bar-center {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .ref-alert-label-box {
      background: var(--nerv-void);
      padding: 0.25rem 2rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }

    /* === Main center area === */
    .ref-center {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .ref-radar-container {
      width: min(280px, 50%);
    }

    .ref-center-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem;
      color: rgba(var(--nerv-primary-rgb), 0.6);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      text-align: center;
    }

    /* === Right: hex grid === */
    .ref-hex-area {
      grid-column: 3;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      gap: 1rem;
    }

    .ref-hex-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem;
      color: rgba(var(--nerv-primary-rgb), 0.5);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>

  <!-- No manual scanline div — nerv.js injects it automatically -->

  <div class="ref-viewport">

    <!-- Grid marks background layer (inset to avoid peeking behind bars) -->
    <div class="ref-grid-bg nerv-grid-marks"></div>

    <div class="ref-content">

      <!-- === Top green stripe === -->
      <div class="ref-stripe-top-green nerv-stripe nerv-stripe-animated"
           style="height: auto;"></div>

      <!-- === DANGER bar === -->
      <div class="ref-alert-bar ref-alert-bar-top">
        <div class="ref-alert-bar-stripe nerv-stripe nerv-stripe-red nerv-stripe-transparent nerv-stripe-animated"
             style="height: 100%;"></div>
        <div class="ref-alert-bar-center">
          <span class="ref-alert-label-box nerv-glow-red"
                style="color: var(--nerv-red); border: var(--nerv-border-width) solid var(--nerv-red);">
            <span class="nerv-glitch nerv-blink" data-text="DANGER">DANGER</span>
          </span>
        </div>
      </div>

      <!-- === Left vertical stripe (animated) === -->
      <div class="ref-stripe-left nerv-stripe-vertical nerv-stripe-animated"></div>

      <!-- === Center: radar display === -->
      <div class="ref-center">
        <span class="ref-center-label">Tactical Scope — Sector VII</span>
        <div class="ref-radar-container">
          <div class="nerv-radar">
            <div class="nerv-radar-sweep"></div>
          </div>
        </div>
        <span class="ref-center-label nerv-flicker" style="color: var(--nerv-green);">
          Range: 120km &middot; Mode: Active
        </span>
      </div>

      <!-- === Right: hex grids (tiled + spaced) === -->
      <div class="ref-hex-area">
        <!-- Tiled (honeycomb, overlapping rows) -->
        <span class="ref-hex-label">Tiled — Honeycomb</span>
        <div class="nerv-hex-grid">
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-danger"><span class="nerv-glitch nerv-blink" data-text="SHINJI">SHINJI</span></div>
            <div class="nerv-hex-cell nerv-hex-warn">ASUKA</div>
            <div class="nerv-hex-cell nerv-hex-safe">REI</div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell"></div>
            <div class="nerv-hex-cell nerv-hex-safe"></div>
            <div class="nerv-hex-cell nerv-hex-danger"></div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-warn"></div>
            <div class="nerv-hex-cell nerv-hex-danger"></div>
            <div class="nerv-hex-cell"></div>
          </div>
        </div>
        <span class="ref-hex-label nerv-blink" style="color: var(--nerv-red);">
          ⚠ 3 Sectors Compromised
        </span>

        <!-- Spaced variant (non-overlapping, boosted fills) -->
        <span class="ref-hex-label" style="margin-top: 0.5rem;">Spaced — Fuel Bundle</span>
        <div class="nerv-hex-grid nerv-hex-grid-spaced nerv-hex-grid-filled">
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-safe">EVA-01</div>
            <div class="nerv-hex-cell nerv-hex-safe">HANGAR</div>
            <div class="nerv-hex-cell nerv-hex-safe">飛行機</div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-safe">BARRACKS</div>
            <div class="nerv-hex-cell nerv-hex-danger">SERVER</div>
            <div class="nerv-hex-cell nerv-hex-safe">SHUTTLE</div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-safe"></div>
            <div class="nerv-hex-cell nerv-hex-safe"></div>
            <div class="nerv-hex-cell nerv-hex-danger"></div>
          </div>
        </div>
      </div>

      <!-- === Bottom EMERGENCY bar: cyan wire stripes === -->
      <div class="ref-alert-bar ref-alert-bar-bottom">
        <div class="ref-alert-bar-stripe nerv-stripe nerv-stripe-amber nerv-stripe-transparent nerv-stripe-animated"
             style="height: 100%; animation-direction: reverse;"></div>
        <div class="ref-alert-bar-center">
          <span class="ref-alert-label-box nerv-cyan"
                style="color: var(--nerv-cyan); border: var(--nerv-border-width) solid var(--nerv-cyan);">
            EMERGENCY
          </span>
        </div>
      </div>

      <!-- === Bottom green stripe === -->
      <div class="ref-stripe-bottom-green nerv-stripe nerv-stripe-animated"
           style="height: auto;"></div>

    </div>
  </div>

  <script src="../dist/nerv.js"></script>
  <script>NERV.init();</script>

</body>
</html>
