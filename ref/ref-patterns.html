<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NERV Patterns — ref-patterns</title>
  <link rel="stylesheet" href="../dist/nerv.css">
  <style>
    /* Reference page layout — NOT part of the design system */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--nerv-void);
      color: var(--nerv-amber);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ref-viewport {
      position: relative;
      width: 960px;
      max-width: 96vw;
      aspect-ratio: 4 / 3;
    }

    .ref-grid-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .ref-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 2rem 1fr 260px;
      grid-template-rows: 1.5rem 1.5rem 1fr 1.5rem 1.5rem;
      width: 100%;
      height: 100%;
      gap: 2px;
    }

    /* === Stripe bars === */
    .ref-stripe-top-green {
      grid-column: 1 / -1;
      grid-row: 1;
    }

    .ref-stripe-top-red {
      grid-column: 1 / -1;
      grid-row: 2;
    }

    .ref-stripe-left {
      grid-column: 1;
      grid-row: 3;
    }

    .ref-stripe-bottom-green {
      grid-column: 1 / -1;
      grid-row: 5;
    }

    .ref-stripe-bottom-red {
      grid-column: 1 / -1;
      grid-row: 4;
    }

    /* === Main center area === */
    .ref-center {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .ref-radar-container {
      width: min(280px, 50%);
    }

    .ref-center-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem;
      color: rgba(var(--nerv-primary-rgb), 0.6);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      text-align: center;
    }

    /* === Right: hex grid === */
    .ref-hex-area {
      grid-column: 3;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      gap: 1rem;
    }

    .ref-hex-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem;
      color: rgba(var(--nerv-primary-rgb), 0.5);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>

  <!-- No manual scanline div — nerv.js injects it automatically -->

  <div class="ref-viewport">

    <!-- Grid marks background layer -->
    <div class="ref-grid-bg nerv-grid-marks"></div>

    <div class="ref-content">

      <!-- === Top stripe pair === -->
      <div class="ref-stripe-top-green nerv-stripe nerv-stripe-animated"
           style="height: auto;"></div>
      <div class="ref-stripe-top-red nerv-stripe nerv-stripe-red nerv-stripe-animated"
           style="height: auto; animation-direction: reverse;"></div>

      <!-- === Left vertical stripe === -->
      <div class="ref-stripe-left nerv-stripe-vertical"></div>

      <!-- === Center: radar display === -->
      <div class="ref-center">
        <span class="ref-center-label">Tactical Scope — Sector VII</span>
        <div class="ref-radar-container">
          <div class="nerv-radar">
            <div class="nerv-radar-sweep"></div>
          </div>
        </div>
        <span class="ref-center-label nerv-flicker" style="color: var(--nerv-green);">
          Range: 120km &middot; Mode: Active
        </span>
      </div>

      <!-- === Right: hex grid with mixed states === -->
      <div class="ref-hex-area">
        <span class="ref-hex-label">Defensive Grid Status</span>
        <div class="nerv-hex-grid">
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-danger"></div>
            <div class="nerv-hex-cell nerv-hex-warn"></div>
            <div class="nerv-hex-cell nerv-hex-safe"></div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell"></div>
            <div class="nerv-hex-cell nerv-hex-safe"></div>
            <div class="nerv-hex-cell nerv-hex-danger"></div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-warn"></div>
            <div class="nerv-hex-cell nerv-hex-danger"></div>
            <div class="nerv-hex-cell"></div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-safe"></div>
            <div class="nerv-hex-cell"></div>
            <div class="nerv-hex-cell nerv-hex-warn"></div>
          </div>
          <div class="nerv-hex-row">
            <div class="nerv-hex-cell nerv-hex-danger"></div>
            <div class="nerv-hex-cell nerv-hex-safe"></div>
            <div class="nerv-hex-cell nerv-hex-warn"></div>
          </div>
        </div>
        <span class="ref-hex-label nerv-blink" style="color: var(--nerv-red);">
          ⚠ 3 Sectors Compromised
        </span>
      </div>

      <!-- === Bottom stripe pair (mirror of top) === -->
      <div class="ref-stripe-bottom-red nerv-stripe nerv-stripe-red nerv-stripe-animated"
           style="height: auto; animation-direction: reverse;"></div>
      <div class="ref-stripe-bottom-green nerv-stripe nerv-stripe-animated"
           style="height: auto;"></div>

    </div>
  </div>

  <script src="../dist/nerv.js"></script>
  <script>NERV.init();</script>

</body>
</html>
