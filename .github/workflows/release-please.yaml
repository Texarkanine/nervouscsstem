name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token (rather than the default GITHUB_TOKEN) is used so the
      # release PR triggers CI like a normal PR. The operator provisions HELPER_APP_ID,
      # HELPER_APP_PRIVATE_KEY, the npmjs.org GitHub environment, and the npm trusted
      # publisher (workflow filename release-please.yaml, environment npmjs.org)
      # after merge.
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HELPER_APP_ID }}
          private-key: ${{ secrets.HELPER_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    environment: npmjs.org
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 ships that.
      # Avoids broken `npm install -g npm` on Node 22
      # (https://github.com/npm/cli/issues/9151).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish

      - name: Upload npm debug log if present
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-debug-log
          path: ~/.npm/_logs/
          if-no-files-found: ignore

      - name: Attach CSS and JS to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/nerv.css dist/nerv.js
