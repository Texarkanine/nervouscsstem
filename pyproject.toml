# Docs-build toolchain for the nervouscsstem ProperDocs site (not a published package).
#
#     uv sync --group docs
#     npm run docs:serve
#     npm run docs:build
#
# `uv sync` installs scripts/nervouscsstem_docs/ editable so properdocs.yml can
# name its superfences formatter with !!python/name:.

[project]
name = "nervouscsstem-docs"
version = "0"
description = "Docs-build toolchain for the nervouscsstem ProperDocs site (not a published package)."
requires-python = ">=3.10"

[dependency-groups]
# properdocs is oprypin's drop-in continuation of MkDocs 1.x.
# See: https://github.com/ProperDocs/properdocs
docs = [
    "properdocs ~= 1.6",
    "mkdocs-material ~= 9.5",
    "mkdocs-awesome-pages-plugin ~= 2.9",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "scripts"

[tool.uv]
required-version = ">=0.5"

# User-level extra indexes (e.g. PyTorch CUDA in ~/.config/uv/uv.toml) are
# merged into a normal `uv lock`. Relock without them:
#   uv lock --no-config
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

